  <p id="ayuda">
    <b>← →</b> mover · <b>Espacio</b> saltar (dos veces en el aire) · <b>Shift</b> correr ·
    <b>↑ ↓</b> apuntar · <b>Z</b> disparar (mantener = cargado) ·
    <b>F</b> granada · <b>E</b> cambiar granada · <b>X</b> tiempo lento · <b>C</b> ultra velocidad ·
    <b>P</b> pausa · <b>F1</b> controles<br>
    <span class="alt">Esquema alternativo (se elige en el menú): <b>WASD</b> + <b>Enter</b> para disparar</span>
  </p>
