<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callar los juegos</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0b1a;
    color: #cfc9e8;
    font-family: "Consolas", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .caja { padding: 28px; max-width: 520px; }
  h1 { font-size: 26px; margin: 0 0 4px; color: #ffd23f; letter-spacing: 2px; }
  p { font-size: 13px; line-height: 1.8; opacity: 0.85; }
  .estado {
    margin: 18px 0;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 4px;
    background: rgba(75, 224, 138, 0.12);
    border: 1px solid rgba(75, 224, 138, 0.35);
    color: #8ce8b0;
  }
  .chico { font-size: 11px; opacity: 0.55; }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 9px 18px;
    margin: 4px;
    border-radius: 4px;
    border: 1px solid #5a4f8a;
    background: #1a1730;
    color: #cfc9e8;
    cursor: pointer;
  }
  button:hover { background: #262042; }
</style>
</head>
<body>
  <div class="caja">
    <h1>SILENCIO</h1>
    <p>Manda la señal de apagado a todas las pestañas de juegos abiertas en este navegador.</p>

    <div class="estado" id="estado">enviando…</div>

    <p class="chico">
      Solo toca los juegos de este sitio. Lo que estés escuchando en otra pestaña
      —YouTube, música, lo que sea— sigue como estaba.
    </p>

    <button onclick="mandar()">Mandar de nuevo</button>
    <button onclick="levantar()">Permitir que vuelvan a sonar</button>

    <p class="chico" id="nota"></p>
  </div>

<script>
  var CLAVE = 'juegos.silencio';
  var estado = document.getElementById('estado');
  var nota = document.getElementById('nota');

  /* El evento `storage` solo llega a las OTRAS pestañas del mismo origen, que es
     justo lo que se necesita: esta página escribe la marca y los juegos que
     estén abiertos la escuchan y se apagan solos. */
  function mandar() {
    try {
      localStorage.setItem(CLAVE, String(Date.now()));
      estado.textContent = 'Señal enviada. Los juegos abiertos se callaron.';
      nota.textContent = 'Si alguno sigue sonando, esa pestaña es vieja: ciérrala y no vuelve a pasar.';
    } catch (e) {
      estado.textContent = 'No se pudo escribir en este navegador.';
      nota.textContent = String(e);
    }
  }

  function levantar() {
    try {
      localStorage.removeItem(CLAVE);
      estado.textContent = 'Listo: los juegos que abras van a sonar normalmente.';
      nota.textContent = 'Los que ya estaban abiertos siguen en silencio hasta que los recargues.';
    } catch (e) {
      estado.textContent = 'No se pudo escribir en este navegador.';
    }
  }

  mandar();
</script>
</body>
</html>
